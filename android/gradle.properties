org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# Kotlin incremental compilation must be off on macOS / Windows paths
# that contain spaces or non-ASCII characters, otherwise the daemon
# fails to close the incremental cache.
kotlin.incremental=false
# We're on AGP 8.11.1 — keep the legacy DSL (`android { ... }` block
# resolves to BaseAppModuleExtension). Switching to true here would
# require migrating to the new com.android.build.api.dsl.* hierarchy
# AND the AGP-bundled Kotlin support, neither of which is supported
# by the Flutter Gradle plugin or the Google Services plugin yet.
android.newDsl=false
android.builtInKotlin=false
