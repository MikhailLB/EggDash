name: eggdash
description: "Egg Dash — a cheerful egg-catching arcade game."
publish_to: 'none'

version: 1.0.1+2

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Local persistence
  shared_preferences: ^2.5.3
  flutter_secure_storage: ^10.0.0

  # Networking & HTTP
  http: ^1.3.0
  connectivity_plus: ^6.1.4
  url_launcher: ^6.3.1

  # Embedded WebView
  webview_flutter: ^4.13.1
  webview_flutter_android: ^4.11.0

  # Attribution + Firebase backbone
  appsflyer_sdk: ^6.15.3
  firebase_core: ^3.13.0
  firebase_messaging: ^15.2.4
  firebase_app_check: ^0.3.2+10
  flutter_local_notifications: ^18.0.1

  # Device / package metadata for UA + diagnostics
  device_info_plus: ^11.3.3
  package_info_plus: ^8.3.0

  # File picker — DO NOT bump to >=10.x. Versions 10+ ship Kotlin-only
  # plugin code that brings its own KGP and conflicts with Flutter's
  # built-in Kotlin support (GeneratedPluginRegistrant fails to find
  # the class). Pin to 8.1.4.
  file_picker: 8.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon.png"
  min_sdk_android: 21
  remove_alpha_ios: true
  adaptive_icon_background: "#F5A623"
  adaptive_icon_foreground: "assets/icon.png"

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/Notifications/
    - assets/Nowifi/
